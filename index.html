<!-- PROJECT: CENTRO MARKET | FILE: shop/index.html | VERSION: 1.0.1 | LAST UPDATED: 2026-11-12 | PURPOSE: Customer PWA (home, catalog with search/filters/sorting, product details, store directory, saved cart, account, favorites, addresses) | CHANGELOG: 1.0.1 Adding to the cart only updates the header counter (the page no longer clears). 1.0.0 Initial version (Batch 4) -->
<!doctype html>
<html lang="en" data-t="system"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Centro Market</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><meta name="theme-color" content="#15803d">
<style>
:root{--bg:#f5f7f4;--cd:#fff;--tx:#18201a;--mu:#5f6b62;--bd:#dfe5df;--pr:#15803d;--pt:#fff;--dn:#b42318;--ok:#067647;--wn:#b54708;--sp:#7c3aed}
:root[data-t=dark]{--bg:#0f1511;--cd:#18211b;--tx:#e9f0ea;--mu:#9aa89d;--bd:#2a362d;--pr:#4ade80;--pt:#052e12;--dn:#f97066;--ok:#47cd89;--wn:#fdb022;--sp:#a78bfa}
@media(prefers-color-scheme:dark){:root[data-t=system]{--bg:#0f1511;--cd:#18211b;--tx:#e9f0ea;--mu:#9aa89d;--bd:#2a362d;--pr:#4ade80;--pt:#052e12;--dn:#f97066;--ok:#47cd89;--wn:#fdb022;--sp:#a78bfa}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}a{color:var(--pr)}
header{position:sticky;top:0;z-index:5;background:var(--cd);border-bottom:1px solid var(--bd);padding:8px 12px;display:flex;gap:8px;align-items:center}header b{color:var(--pr);cursor:pointer;white-space:nowrap}header form{flex:1;display:flex;gap:6px}
nav{display:flex;gap:4px;overflow-x:auto;background:var(--cd);border-bottom:1px solid var(--bd);padding:6px 8px;position:sticky;top:53px;z-index:4}nav button{white-space:nowrap;background:none;border:0;color:var(--mu);padding:8px 12px;border-radius:8px;font:inherit;cursor:pointer}nav button.on{background:var(--pr);color:var(--pt)}
main{max-width:1100px;margin:0 auto;padding:14px}.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}.pcard{background:var(--cd);border:1px solid var(--bd);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}.pcard .im{aspect-ratio:1;background:var(--bd);object-fit:cover;width:100%;cursor:pointer;display:block}.pcard .bd{padding:8px 10px;display:flex;flex-direction:column;gap:3px;flex:1}
h2{margin:6px 0 10px;font-size:18px}h3{margin:0 0 8px;font-size:15px}label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}input[type=checkbox]{width:auto}
.b{background:var(--pr);color:var(--pt);border:0;border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer;margin:2px}.g{background:none;color:var(--tx);border:1px solid var(--bd)}.d{background:var(--dn);color:#fff}button:disabled{opacity:.5}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}.mu{color:var(--mu)}.s{font-size:13px}.empty{padding:22px;text-align:center;color:var(--mu)}.ck{display:flex;gap:6px;align-items:center;color:var(--tx);font-size:14px;margin:4px 0}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;border:1px solid var(--bd);margin-right:4px}.sale{color:var(--dn)}.sp{color:var(--sp)}.so{color:var(--wn)}.pr{font-weight:700}.old{text-decoration:line-through;color:var(--mu);font-weight:400;font-size:13px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}.chips button{white-space:nowrap}.hs{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}.hs>.pcard{min-width:160px;max-width:160px}
.ln{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--bd)}.ln img,.ph{width:60px;height:60px;object-fit:cover;border-radius:8px;background:var(--bd);flex:none}.ln>div{flex:1;min-width:0}.warn{color:var(--dn);font-size:13px}
.gal{display:flex;gap:8px;overflow-x:auto;margin-bottom:10px}.gal img{height:240px;max-width:100%;object-fit:cover;border-radius:10px}.note{border-left:4px solid var(--wn);background:var(--cd);padding:10px 12px;border-radius:8px;margin-bottom:14px}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;display:none;z-index:9;max-width:90%}#toast.e{background:var(--dn);color:#fff}.box{max-width:430px;margin:5vh auto}
</style></head><body><div id="app"></div><div id="toast" role="status"></div>
<script>
'use strict';
const DEFAULT_API=''; // optional: paste your Web app URL (ending /exec); otherwise the app asks once and remembers it
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls=localStorage,R=()=>'r'+crypto.randomUUID().replace(/-/g,''),dev=ls.cs_dev||(ls.cs_dev=crypto.randomUUID().replace(/-/g,''));
let API=ls.cm_api||DEFAULT_API,tok=ls.cs_tok||'',me=null,favs=[],cart=JSON.parse(ls.cs_cart||'[]'),Q={q:'',categoryId:'',sort:'recommended',minPrice:'',maxPrice:'',inStockOnly:false,onSale:false,pickup:false,delivery:false},CATS=[],H0=null,mode='login';
const peso=n=>'₱'+Number(n||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2}),sav=()=>ls.cs_cart=JSON.stringify(cart);
function toast(m,e){const t=$('#toast');t.textContent=m;t.className=e?'e':'';t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',e?6000:2400)}
async function api(action,payload){let j;try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,payload:payload||{},token:tok||null,requestId:R(),deviceId:dev})});j=await r.json()}
 catch(e){throw{message:navigator.onLine?'Cannot reach the server. Check your connection.':'You are offline. Browsing needs internet.'}}
 if(!j||!j.ok){const er=(j&&j.error)||{message:'Unexpected reply from the server. Is this the Centro Market Web app URL?'};if(er.code==='UNAUTHENTICATED'&&tok){tok='';ls.removeItem('cs_tok');me=null;toast('Session expired. Please log in again.',1)}throw er}return j.data}
async function run(fn){try{await fn()}catch(e){console.error(e);toast((e&&(e.message||e.code))||String(e)||'Something went wrong',1)}}
const star=p=>`<span class="tag">${esc(p)}</span>`;
function card(p){const off=p.OnSale?Math.round((1-p.EffectivePrice/p.Price)*100):0;
 return `<div class="pcard"><img class="im" data-a="open" data-id="${esc(p.ProductID)}" src="${esc(p.Image||'')}" alt="" onerror="this.style.visibility='hidden'"><div class="bd"><div><b data-a="open" data-id="${esc(p.ProductID)}" style="cursor:pointer">${esc(p.Name)}</b></div>
 <div class="pr">${peso(p.EffectivePrice)}<span class="mu s"> / ${esc(p.Unit)}</span> ${p.OnSale?`<span class="old">${peso(p.Price)}</span>`:''}</div><div class="s mu"><a href="#v/${esc(p.VendorID)}">${esc(p.StoreName)}</a></div>
 <div class="s">${p.Sponsored?'<span class="tag sp">Sponsored</span>':''}${off?`<span class="tag sale">-${off}%</span>`:''}${p.LowStock?'<span class="tag so">Low stock</span>':''}</div>
 <div style="margin-top:auto">${p.Available?`<button class="b" data-a="add" data-id="${esc(p.ProductID)}" data-p="${p.EffectivePrice}" data-q="${p.MinOrder||1}">Add to cart</button>`:'<span class="tag so">Sold out</span>'}<button class="b g" data-a="fav" data-id="${esc(p.ProductID)}">${favs.includes(p.ProductID)?'♥':'♡'}</button></div></div></div>`}
const grid=a=>a.length?`<div class="grid">${a.map(card).join('')}</div>`:'<div class="empty">No products found.</div>';

/* ---------- shell & routing ---------- */
function shell(){$('#app').innerHTML=`<header><b data-a="go" data-id="home">Centro Market</b><form data-f="search"><input name="q" placeholder="Search fish, meat, vegetables…" value="${esc(Q.q)}"><button class="b">Search</button></form><button class="b g" id="cc" data-a="go" data-id="cart">Cart (${cart.length})</button></header>
 <nav>${[['home','Home'],['catalog','Shop'],['vendors','Stores'],['account',me?'My account':'Log in'],['theme','Theme']].map(t=>`<button data-a="${t[0]==='theme'?'theme':'go'}" data-id="${t[0]}" class="${location.hash.slice(1).split(/[\/?]/)[0]===t[0]||(t[0]==='home'&&!location.hash)?'on':''}">${t[1]}</button>`).join('')}</nav><main id="view"></main>`}
async function route(){if(!$('#view'))shell();const h=location.hash.slice(1)||'home',[n,arg]=h.split('/');shell();const v=$('#view');v.innerHTML='<div class="empty">Loading…</div>';
 try{v.innerHTML=await (V[n.split('?')[0]]||V.home)(arg);scrollTo(0,0);const f=window['after_'+n.split('?')[0]];if(f)f(arg)}catch(e){v.innerHTML=`<div class="card"><b>Could not load.</b> ${esc(e.message)}${/updated|UNKNOWN/.test(e.code||'')?'':''}</div>`}}
async function boot(){if(!API)return $('#app').innerHTML=`<div class="box"><div class="card"><h2>Connect to Centro Market</h2><form data-f="connect"><label>Web app URL (ends with /exec)</label><input name="url" type="url" required placeholder="https://script.google.com/macros/s/…/exec"><p class="mu">Saved on this device only.</p><button class="b" style="width:100%">Continue</button></form></div></div>`;
 if(tok){try{const d=await api('customer.me');me=d.user;const f=await api('customer.listFavorites');favs=f.ids}catch(e){tok='';ls.removeItem('cs_tok')}}
 try{CATS=(await api('catalog.home')).categories}catch(e){}route()}
addEventListener('hashchange',route);

/* ---------- views ---------- */
const V={
async home(){const d=await api('catalog.home');CATS=d.categories;H0=d;const s=d.settings,x=d.sections,sec=(t,a,l)=>a.length?`<h2>${t}${l?` <a class="s" href="${l}">See all</a>`:''}</h2><div class="hs">${a.map(card).join('')}</div>`:'';
 return `${s.announcement?`<div class="note">${esc(s.announcement)}</div>`:''}${s.ordering_enabled?'':'<div class="note"><b>Ordering is paused.</b> You can still browse and save your cart.</div>'}
 ${(s.banners||[]).slice(0,3).map(b=>b&&b.title?`<div class="card"><b>${esc(b.title)}</b></div>`:'').join('')}
 <h2>Categories</h2><div class="chips">${d.categories.map(c=>`<button class="b g" data-a="cat" data-id="${esc(c.CategoryID)}">${esc(c.Name)} (${c.Count})</button>`).join('')}</div>
 ${sec('Daily deals',x.deals,'#catalog?sale')}${sec('New arrivals',x.newArrivals,'#catalog?new')}${sec('Best sellers',x.bestSelling,'#catalog?best')}
 ${x.vendors.length?`<h2>Stores <a class="s" href="#vendors">See all</a></h2><div class="grid">${x.vendors.map(vc).join('')}</div>`:''}
 ${x.marketPrices.length?`<h2>Today's market prices <span class="s mu">(reference only, not store prices)</span></h2><div class="card">${x.marketPrices.map(m=>`<div class="row s"><b>${esc(m.ItemName)}</b><span>${peso(m.Price)} / ${esc(m.Unit)}</span><span class="mu">${esc(m.Source||'')}</span></div>`).join('')}</div>`:''}
 ${x.newArrivals.length?'':'<div class="empty">No products are listed yet. Please check back soon.</div>'}`},
async catalog(){const h=location.hash.split('?')[1]||'';if(h==='sale')Q.onSale=true;if(h==='new')Q.sort='newest';if(h==='best')Q.sort='best_selling';if(h)history.replaceState(null,'','#catalog');if(!CATS.length)CATS=(await api('catalog.home')).categories;
 const d=await api('catalog.products',pq(1));window._pg=1;window._more=d.hasMore;const o=(a,v)=>a.map(x=>`<option value="${esc(x[0])}"${x[0]===v?' selected':''}>${esc(x[1])}</option>`).join(''),ck=(n,l)=>`<label class="ck"><input type="checkbox" name="${n}" ${Q[n]?'checked':''}> ${l}</label>`;
 return `<h2>Shop</h2><div class="card"><form data-f="filters"><div class="row"><div><label>Category</label><select name="categoryId"><option value="">All categories</option>${o(CATS.map(c=>[c.CategoryID,c.Name]),Q.categoryId)}</select></div><div><label>Sort by</label><select name="sort">${o([['recommended','Recommended'],['best_selling','Best selling'],['price_low','Price: low to high'],['price_high','Price: high to low'],['newest','Newest'],['name','Name A–Z'],['featured','Featured']],Q.sort)}</select></div>
 <div><label>Min ₱</label><input name="minPrice" type="number" min="0" step="any" value="${esc(Q.minPrice)}"></div><div><label>Max ₱</label><input name="maxPrice" type="number" min="0" step="any" value="${esc(Q.maxPrice)}"></div></div>
 <div class="row">${ck('inStockOnly','In stock only')}${ck('onSale','On sale')}${ck('pickup','Pickup available')}${ck('delivery','Delivery available')}</div><button class="b">Apply</button> <button type="button" class="b g" data-a="clear">Clear</button></form></div>
 <p class="mu s">${d.total} product${d.total===1?'':'s'}${Q.q?` for “${esc(Q.q)}”`:''}</p><div id="pl">${grid(d.products)}</div>${d.hasMore?'<div style="text-align:center"><button class="b g" data-a="more">Load more</button></div>':''}`},
async p(id){const d=await api('catalog.product',{productId:id}),p=d.product,v=d.vendor,off=p.OnSale?Math.round((1-p.EffectivePrice/p.Price)*100):0;
 return `<p><a href="#catalog">← Back to shop</a></p><div class="card">${p.Images.length?`<div class="gal">${p.Images.map(u=>`<img src="${esc(u)}" alt="">`).join('')}</div>`:''}<h2>${esc(p.Name)}</h2>
 <div class="pr" style="font-size:20px">${peso(p.EffectivePrice)}<span class="mu s"> / ${esc(p.Unit)}</span> ${p.OnSale?`<span class="old">${peso(p.Price)}</span> <span class="tag sale">-${off}%</span>`:''}</div>
 <p>${p.Sponsored?'<span class="tag sp">Sponsored</span>':''}${esc(p.CategoryName)? '<span class="tag">'+esc(p.CategoryName)+'</span>':''}${p.Available?'<span class="tag" style="color:var(--ok)">In stock</span>':'<span class="tag so">Sold out</span>'}${d.stockNote?`<span class="tag so">${esc(d.stockNote)}</span>`:''}</p>
 <p style="white-space:pre-wrap">${esc(p.Description)}</p><p class="s mu">${p.MinOrder?'Minimum order: '+p.MinOrder+' '+esc(p.Unit)+'. ':''}${p.MaxOrder?'Maximum order: '+p.MaxOrder+' '+esc(p.Unit)+'. ':''}${p.AllowDecimal?'Sold by weight, decimals allowed.':'Whole quantities only.'}</p>
 ${p.Available?`<div class="row" style="align-items:end"><div><label>Quantity (${esc(p.Unit)})</label><input id="qty" type="number" min="${p.MinOrder||(p.AllowDecimal?0.1:1)}" step="${p.AllowDecimal?'0.1':'1'}" value="${p.MinOrder||1}"></div><div><button class="b" data-a="addq" data-id="${esc(p.ProductID)}" data-p="${p.EffectivePrice}">Add to cart</button></div></div>`:''}
 <button class="b g" data-a="fav" data-id="${esc(p.ProductID)}">${favs.includes(p.ProductID)?'♥ Saved':'♡ Save'}</button><button class="b g" data-a="share" data-id="${esc(p.ProductID)}" data-d="${esc(p.Name)}">Share</button></div>
 <div class="card"><h3><a href="#v/${esc(v.VendorID)}">${esc(v.StoreName)}</a> ${v.IsOpen?'<span class="tag" style="color:var(--ok)">Open</span>':'<span class="tag">Closed</span>'}</h3><div class="s mu">${esc(v.StallLocation)}</div>
 <div class="s" style="margin-top:6px">${v.PickupEnabled?'<span class="tag">Pickup</span>':''}${v.DeliveryEnabled?`<span class="tag">Delivery ${v.DeliveryFee?peso(v.DeliveryFee):'free'}</span>`:''}${v.ReservationEnabled?'<span class="tag">Reserve</span>':''}${v.AcceptCash?'<span class="tag">Cash</span>':''}${v.AcceptGcash?'<span class="tag">GCash</span>':''}${v.MinOrderAmount?`<span class="tag">Min order ${peso(v.MinOrderAmount)}</span>`:''}</div>
 ${v.MessengerLink?`<p><a href="${esc(v.MessengerLink)}" target="_blank" rel="noopener noreferrer">Chat with the store on Messenger</a></p>`:''}</div>`},
async vendors(){const d=await api('catalog.vendors',{q:Q.vq||''});return `<h2>Stores</h2><div class="card"><form data-f="vsearch"><div class="row"><input name="q" placeholder="Search stores or stalls" value="${esc(Q.vq||'')}"><button class="b">Search</button></div></form></div>${d.vendors.length?`<div class="grid">${d.vendors.map(vc).join('')}</div>`:'<div class="empty">No stores found.</div>'}`},
async v(id){const d=await api('catalog.vendor',{vendorId:id}),v=d.vendor,hr=v.OperatingHours||{};
 return `<p><a href="#vendors">← All stores</a></p><div class="card"><h2>${esc(v.StoreName)} ${v.Sponsored?'<span class="tag sp">Sponsored</span>':''}</h2><div class="mu">${esc(v.StallLocation)} · ${v.IsOpen?'Open now':'Closed now'}</div><p>${esc(v.Description)}</p>
 <div class="s">${v.PickupEnabled?'<span class="tag">Pickup</span>':''}${v.DeliveryEnabled?`<span class="tag">Delivery ${v.DeliveryFee?peso(v.DeliveryFee):'free'}</span>`:''}${v.AcceptCash?'<span class="tag">Cash</span>':''}${v.AcceptGcash?'<span class="tag">GCash</span>':''}${v.MinOrderAmount?`<span class="tag">Min order ${peso(v.MinOrderAmount)}</span>`:''}${v.PrepMinutes?`<span class="tag">~${v.PrepMinutes} min prep</span>`:''}</div>
 ${Object.keys(hr).length?`<p class="s mu">${['mon','tue','wed','thu','fri','sat','sun'].filter(k=>hr[k]).map(k=>k.toUpperCase()+' '+(hr[k].closed?'closed':esc(hr[k].open)+'–'+esc(hr[k].close))).join(' · ')}</p>`:''}
 ${v.MessengerLink?`<a href="${esc(v.MessengerLink)}" target="_blank" rel="noopener noreferrer">Messenger</a> `:''}${v.FacebookPage?`<a href="${esc(v.FacebookPage)}" target="_blank" rel="noopener noreferrer">Facebook page</a>`:''}</div><h2>Products</h2>${grid(d.products.products)}`},
async cart(){let r=null;if(cart.length)r=await api('cart.validate',{items:cart.map(x=>({productId:x.id,qty:x.qty,priceSeen:x.price}))});
 if(!r)return '<h2>Your cart</h2><div class="empty">Your cart is empty. <a href="#catalog">Start shopping</a></div>';
 const M={UNAVAILABLE:()=>'No longer available',QTY_BELOW_MIN:l=>'Minimum order is '+l.minOrder,QTY_ABOVE_MAX:l=>'Maximum order is '+l.maxOrder,QTY_FRACTION:()=>'Whole quantities only',EXCEEDS_STOCK:l=>'Only '+l.onHand+' in stock',PRICE_CHANGED:l=>'Price changed from '+peso(l.previousPrice)+' to '+peso(l.unitPrice)};
 return `<h2>Your cart</h2>${r.vendors.map(g=>`<div class="card"><h3>${esc(g.storeName)}</h3>${g.lines.map(l=>`<div class="ln">${l.image?`<img src="${esc(l.image)}" alt="">`:'<div class="ph"></div>'}<div><b>${esc(l.name)}</b><div class="s mu">${l.issues.includes('UNAVAILABLE')?'':peso(l.unitPrice)+' / '+esc(l.unit)}</div>
 ${l.issues.map(i=>`<div class="warn">${esc(M[i](l))}${i==='PRICE_CHANGED'?` <button class="b g" data-a="accept" data-id="${esc(l.productId)}" data-p="${l.unitPrice}">Accept new price</button>`:''}</div>`).join('')}
 <div><button class="b g" data-a="dec" data-id="${esc(l.productId)}">−</button> <b>${l.qty}</b> <button class="b g" data-a="inc" data-id="${esc(l.productId)}">+</button> <button class="b g" data-a="rm" data-id="${esc(l.productId)}">Remove</button></div></div><div class="pr">${l.issues.includes('UNAVAILABLE')?'':peso(l.lineTotal)}</div></div>`).join('')}
 <div class="row s" style="margin-top:8px"><span>Subtotal: <b>${peso(g.subtotal)}</b></span>${g.vendorId?`<span class="mu">${g.deliveryEnabled?'Delivery fee: '+(g.deliveryFee?peso(g.deliveryFee):'free'):'Pickup only'}</span>`:''}</div>${g.vendorId&&!g.meetsMinimum?`<div class="warn">This store's minimum order is ${peso(g.minOrderAmount)}.</div>`:''}</div>`).join('')}
 <div class="card"><div class="pr" style="font-size:18px">Estimated total: ${peso(r.estimatedTotal)}</div><p class="mu s">${esc(r.note)} Prices and stock are checked again at checkout.</p>${r.vendors.some(g=>g.lines.some(l=>l.issues.includes('UNAVAILABLE')))?'<button class="b g" data-a="clean">Remove unavailable items</button>':''}
 <div class="note" style="margin:10px 0 0"><b>Checkout is coming in the next update.</b> Your cart is saved${tok?' to your account':' on this device — log in to keep it on every device'}.</div></div>`},
async account(){if(!me)return `<div class="box"><div class="card"><div class="row"><button class="b ${mode==='login'?'':'g'}" data-a="mode" data-id="login">Log in</button><button class="b ${mode==='login'?'g':''}" data-a="mode" data-id="register">Create account</button></div></div><div class="card"><form data-f="${mode}"><h2>${mode==='login'?'Log in':'Create your account'}</h2>${mode==='register'?'<label>Full name</label><input name="fullName" required maxlength="100">':''}<label>Mobile number</label><input name="mobile" type="tel" required autocomplete="username"><label>Password${mode==='register'?' (8+ characters, letters and numbers)':''}</label><input name="pw" type="password" required autocomplete="${mode==='login'?'current-password':'new-password'}"><button class="b" style="width:100%;margin-top:12px">${mode==='login'?'Log in':'Create account'}</button></form></div></div>`;
 const d=await api('customer.me'),p=d.profile,f=await api('customer.listFavorites');favs=f.ids;
 return `<h2>My account</h2><div class="card"><form data-f="profile"><div class="row"><div><label>Full name</label><input name="fullName" required value="${esc(p.FullName)}"></div><div><label>Mobile</label><input value="${esc(d.user.Mobile)}" disabled></div></div><div class="row"><div><label>Barangay</label><input name="barangay" value="${esc(p.Barangay)}"></div><div><label>Email (optional)</label><input name="email" type="email" value="${esc(d.user.Email)}"></div></div><label>Default address</label><input name="defaultAddress" value="${esc(p.DefaultAddress)}"><button class="b" style="margin-top:10px">Save profile</button></form></div>
 <div class="card"><h3>Saved addresses (${(p.SavedAddresses||[]).length}/5)</h3>${(p.SavedAddresses||[]).map(a=>`<div class="ln"><div><b>${esc(a.label)}</b><div class="s">${esc(a.address)}</div><div class="s mu">${esc(a.contactName)} · ${esc(a.contactMobile)}</div></div><button class="b g" data-a="deladdr" data-id="${esc(a.id)}">Delete</button></div>`).join('')}
 <form data-f="addr"><div class="row"><div><label>Label</label><input name="label" required maxlength="30" placeholder="Home"></div><div><label>Contact name</label><input name="contactName" required maxlength="100"></div><div><label>Contact mobile</label><input name="contactMobile" type="tel" required></div></div><label>Address</label><input name="address" required maxlength="200"><button class="b" style="margin-top:10px">Add address</button></form></div>
 <h2>Favorites</h2>${grid(f.favorites)}<p><button class="b g" data-a="logout">Log out</button></p>`}};
const vc=v=>`<div class="card" style="margin:0"><b><a href="#v/${esc(v.VendorID)}">${esc(v.StoreName)}</a></b> ${v.Sponsored?'<span class="tag sp">Sponsored</span>':''}<div class="s mu">${esc(v.StallLocation)}</div><div class="s">${esc(v.Categories.join(', '))}</div><div class="s">${v.IsOpen?'<span class="tag" style="color:var(--ok)">Open</span>':'<span class="tag">Closed</span>'}${v.ProductCount} products</div></div>`;
const pq=pg=>{const o={page:pg,pageSize:20,sort:Q.sort};if(Q.q)o.q=Q.q;['categoryId','minPrice','maxPrice'].forEach(k=>{if(Q[k]!=='')o[k]=Q[k]});['inStockOnly','onSale','pickup','delivery'].forEach(k=>{if(Q[k])o[k]=true});return o};

/* ---------- cart helpers ---------- */
const step=id=>{const x=cart.find(c=>c.id===id);return x&&x.step||1};
const cnt=()=>{const e=$('#cc');if(e)e.textContent='Cart ('+cart.length+')'};
async function push(){sav();cnt();if(tok)try{await api('cart.set',{items:cart.map(x=>({productId:x.id,qty:x.qty,priceSeen:x.price}))})}catch(e){if(e.code!=='UNAUTHENTICATED')toast(e.message,1)}}
async function addItem(id,qty,price){const x=cart.find(c=>c.id===id);if(x){x.qty=Math.round((x.qty+qty)*1000)/1000;x.price=price}else cart.push({id,qty,price});await push();toast('Added to cart')}
async function mergeCart(){try{const s=await api('cart.get');s.items.forEach(i=>{const x=cart.find(c=>c.id===i.productId);if(!x)cart.push({id:i.productId,qty:i.qty,price:i.priceSeen})});await push()}catch(e){}}

/* ---------- forms & actions ---------- */
const E=(f,n)=>f.elements[n];
const H={
async connect(f){const u=E(f,'url').value.trim();if(!/^https:\/\/script\.google\.com\/macros\/s\/[^\/\s]+\/exec$/.test(u))throw{message:'Paste the full Web app URL ending in /exec.'};ls.cm_api=API=u;boot()},
async search(f){Q.q=E(f,'q').value.trim();location.hash==='#catalog'?route():location.hash='#catalog'},
async filters(f){['categoryId','sort','minPrice','maxPrice'].forEach(k=>Q[k]=E(f,k).value);['inStockOnly','onSale','pickup','delivery'].forEach(k=>Q[k]=E(f,k).checked);route()},
async vsearch(f){Q.vq=E(f,'q').value.trim();route()},
async login(f){const d=await api('auth.login',{mobile:E(f,'mobile').value,password:E(f,'pw').value});if(d.user.Role!=='CUSTOMER')throw{message:'Please use the Admin or Vendor app for that account.'};tok=ls.cs_tok=d.token;me=d.user;await mergeCart();const fv=await api('customer.listFavorites');favs=fv.ids;toast('Welcome back!');route()},
async register(f){const d=await api('auth.registerCustomer',{fullName:E(f,'fullName').value,mobile:E(f,'mobile').value,password:E(f,'pw').value});tok=ls.cs_tok=d.token;me=d.user;await mergeCart();toast('Account created');route()},
async profile(f){await api('customer.updateProfile',{fullName:E(f,'fullName').value,barangay:E(f,'barangay').value,defaultAddress:E(f,'defaultAddress').value,email:E(f,'email').value});toast('Profile saved');route()},
async addr(f){await api('customer.saveAddress',{label:E(f,'label').value,contactName:E(f,'contactName').value,contactMobile:E(f,'contactMobile').value,address:E(f,'address').value});toast('Address saved');route()}};
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-f]');if(!f)return;e.preventDefault();const b=f.querySelector('button:not([type=button])');b.disabled=true;run(()=>H[f.dataset.f](f)).finally(()=>b.disabled=false)});
const A={
go(id){location.hash='#'+id},open(id){location.hash='#p/'+id},theme(){const o=['system','light','dark'],h=document.documentElement;h.dataset.t=o[(o.indexOf(h.dataset.t)+1)%3];ls.cs_theme=h.dataset.t;toast('Theme: '+h.dataset.t)},
cat(id){Q.categoryId=id;Q.q='';location.hash='#catalog'},clear(){Q={q:'',categoryId:'',sort:'recommended',minPrice:'',maxPrice:'',inStockOnly:false,onSale:false,pickup:false,delivery:false};route()},
async more(){const d=await api('catalog.products',pq(++window._pg));$('#pl .grid').insertAdjacentHTML('beforeend',d.products.map(card).join(''));if(!d.hasMore)$('[data-a=more]').remove()},
async add(id,_,b){await addItem(id,+b.dataset.q||1,+b.dataset.p)},async addq(id,_,b){const q=parseFloat($('#qty').value);if(!(q>0))throw{message:'Enter a quantity.'};await addItem(id,q,+b.dataset.p)},
async fav(id){if(!tok){toast('Log in to save favorites.',1);location.hash='#account';return}const d=await api('customer.toggleFavorite',{productId:id});favs=d.favorite?favs.concat(id):favs.filter(x=>x!==id);toast(d.favorite?'Saved to favorites':'Removed from favorites');route()},
async share(id,name){const u=location.href;if(navigator.share)await navigator.share({title:name,url:u}).catch(()=>{});else{await navigator.clipboard.writeText(u);toast('Link copied')}},
async inc(id){const x=cart.find(c=>c.id===id);x.qty=Math.round((x.qty+(Number.isInteger(x.qty)?1:0.5))*1000)/1000;await push();route()},async dec(id){const x=cart.find(c=>c.id===id),s=Number.isInteger(x.qty)?1:0.5;x.qty=Math.round((x.qty-s)*1000)/1000;if(x.qty<=0)cart=cart.filter(c=>c.id!==id);await push();route()},
async rm(id){cart=cart.filter(c=>c.id!==id);await push();route()},async accept(id,_,b){cart.find(c=>c.id===id).price=+b.dataset.p;await push();route()},
async clean(){const r=await api('cart.validate',{items:cart.map(x=>({productId:x.id,qty:x.qty}))}),bad=new Set();r.vendors.forEach(g=>g.lines.forEach(l=>{if(l.issues.includes('UNAVAILABLE'))bad.add(l.productId)}));cart=cart.filter(c=>!bad.has(c.id));await push();route()},
mode(id){mode=id;route()},async deladdr(id){await api('customer.deleteAddress',{addressId:id});route()},
async logout(){await api('auth.logout').catch(()=>{});tok='';ls.removeItem('cs_tok');me=null;favs=[];toast('Logged out');route()}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||!A[b.dataset.a])return;e.preventDefault();run(()=>A[b.dataset.a](b.dataset.id,b.dataset.d,b))});
addEventListener('offline',()=>toast('You are offline. Browsing needs internet.',1));
if(ls.cs_theme)document.documentElement.dataset.t=ls.cs_theme;
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
boot();
</script></body></html>
